services:
  # --- Vector Database ---
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: omnibrain-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    
      

  # --- Redis Caching Layer (M2) ---
  redis:
    image: redis:7-alpine
    container_name: omnibrain-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- FastAPI Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: omnibrain-backend

    restart: always

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    ports:
      - "8000:8000"

    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
  
    

  # --- Frontend Application ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnibrain-frontend
    restart: always
    ports:
      - "8501:8501"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  qdrant_data:
  redis_data:
